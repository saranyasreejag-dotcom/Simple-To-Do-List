kind = "mobile"
previewPath = "/"
title = "Simple To-Do"
description = "A straightforward personal to-do list for adding tasks, marking them complete, and clearing completed tasks."
version = "1.0.0"
id = "artifacts/simple-todo"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 25053

[services.development]
run = "pnpm --filter @workspace/simple-todo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/simple-todo", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/simple-todo", "run", "serve" ]

[services.env]
PORT = "25053"
BASE_PATH = "/"
